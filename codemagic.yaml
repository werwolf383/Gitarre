workflows:
  neonfret-simulator:
    name: NeonFret iPhone compile test
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Unpack NeonFret project
        script: |
          set -e
          rm -rf "$CM_BUILD_DIR/NeonFret"
          unzip -q "$CM_BUILD_DIR/NeonFret_iPhone_MVP.zip" -d "$CM_BUILD_DIR"
          test -f "$CM_BUILD_DIR/NeonFret/NeonFret.xcodeproj/project.pbxproj"
      - name: Build iOS Simulator app
        script: |
          set -e
          cd "$CM_BUILD_DIR/NeonFret"
          xcodebuild build \
            -project "NeonFret.xcodeproj" \
            -scheme "NeonFret" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
